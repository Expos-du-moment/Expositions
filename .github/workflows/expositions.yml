name: Expos du moment

on:
  schedule:
    - cron: "40 5 * * *"   # chaque jour à 5h40 UTC (6h40 à Paris en hiver)
  push:
    branches: [main]
    paths:
      - "data/selection.json"
      - "data/affluence.json"
      - "app/**"
      - "refresh.py"
      - "build.py"
      - ".github/workflows/expositions.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: expositions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # enregistre la base mise à jour dans le dépôt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Renouveler la base et repérer les nouvelles expositions
        run: python refresh.py
      - name: Enregistrer la base
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Base inchangée."; exit 0; fi
          git commit -m "Mise à jour des expositions du $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::Envoi de la base impossible après 3 essais."; exit 1

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}   # inclut la base que le job précédent vient d'enregistrer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Construire le site
        run: python build.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
